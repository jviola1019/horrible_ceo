name: Validate and deploy Horrible Industries
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and accounting tests
        run: npm test
      - name: Monte Carlo model audit
        run: npm run audit
      - name: Build standalone and hosted editions
        run: npm run build
      - name: Install Playwright and choose available Chromium browser
        run: |
          python3 -m pip install playwright==1.56.0
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python3 -m playwright install chromium
          fi
      - name: Desktop and phone browser smoke tests
        run: npm run test:browser
        env:
          REQUIRE_HOSTED_TEST: '1'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
