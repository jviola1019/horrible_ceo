function validateDecision(d){

function advanceRivals(rivals,seed,quarter,playerDecision){

  if(move===0){p.price=clamp(p.price-5,25,125);stories.push(playerDecision.price<p.price?`${p.name} cut prices in response to your pricing.`:`${p.name} cut prices by $5.`);}

function playQuarter(state,decision){

 next.feed=[{quarter:state.quarter,title:event.title,text:event.text,tone:event.tone},...b.stories.map(t=>({quarter:state.quarter,title:'Competitor alert',text:t,tone:'neutral'})),...state.feed].slice(0,38);

function validateState(state){
 const goodNum=(v,min=-1e10,max=1e10)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;
 const bounded=(v)=>Number.isInteger(v)&&goodNum(v,0,100);
 const brief=(v,max=2000)=>typeof v==='string'&&v.length<=max;
 if(!state||typeof state!=='object'||state.version!==GAME_VERSION||!Number.isInteger(state.quarter)||state.quarter<1||state.quarter>MAX_QUARTERS+1)return false;
 if(!Number.isInteger(state.seed)||state.seed<1||!Number.isInteger(state.rng)||state.rng<1)return false;
 if(!goodNum(state.cash)||!goodNum(state.debt,0,300000)||!goodNum(state.plant,0)||!goodNum(state.capacity,4200,50000)||!goodNum(state.staff,1,40))return false;
 if(![state.morale,state.trust,state.reputation,state.quality,state.novelty].every(bounded))return false;
 if(!PRODUCTS.some(p=>p.id===state.productId)||!['active','failed','won'].includes(state.status)||!brief(state.endReason))return false;
 if(!Array.isArray(state.history)||state.history.length>MAX_QUARTERS||state.history.length!==state.quarter-1||!Array.isArray(state.rivals)||state.rivals.length!==3||!Array.isArray(state.feed)||state.feed.length>40||!Array.isArray(state.achievements)||state.achievements.length>6)return false;
 if(state.status==='active'&&state.quarter>MAX_QUARTERS)return false;
 if(!state.rivals.every((r,i)=>{const orig=INITIAL_RIVALS[i];return r&&r.id===orig.id&&r.name===orig.name&&r.ticker===orig.ticker&&r.icon===orig.icon&&r.color===orig.color&&r.style===orig.style&&goodNum(r.price,25,125)&&[r.quality,r.novelty,r.practical,r.trust,r.reputation].every(bounded)&&goodNum(r.marketing,0,500000)&&goodNum(r.cash,0,1e9);}))return false;
 if(!state.achievements.every(a=>['firstprofit','million','culture','quality','cash','survivor'].includes(a)))return false;
 if(!state.feed.every(e=>e&&Number.isInteger(e.quarter)&&e.quarter>=1&&e.quarter<=MAX_QUARTERS&&brief(e.title)&&brief(e.text)&&['neutral','good','bad'].includes(e.tone)))return false;
 const expenses=['cogs','payroll','overhead','marketing','research','people','incident','depreciation','interest','tax','capitalExpenditure','launchCost','financing'];
 const validReport=h=>h&&Number.isInteger(h.quarter)&&h.quarter>=1&&h.quarter<=MAX_QUARTERS&&brief(h.product,150)&&Number.isInteger(h.price)&&goodNum(h.units,0,1e6)&&goodNum(h.demand,0,1e6)&&['revenue','operatingIncome','pretax','netIncome','operationsCash','cash','debt','plant','netWorth','margin','morale','trust','reputation','quality','novelty'].every(key=>goodNum(h[key]))&&h.expenses&&expenses.every(key=>goodNum(h.expenses[key]))&&Array.isArray(h.market)&&h.market.length===3&&h.market.every(m=>m&&brief(m.name,100)&&goodNum(m.volume,0,1e7)&&goodNum(m.units,0,1e7)&&goodNum(m.share,0,1)&&Array.isArray(m.rivalShares)&&m.rivalShares.length===3&&m.rivalShares.every(x=>goodNum(x,0,1)))&&(!h.event||(brief(h.event.title)&&brief(h.event.text)))&&(!h.rivalNews||(Array.isArray(h.rivalNews)&&h.rivalNews.length<=3&&h.rivalNews.every(x=>brief(x,300))));
 if(!state.history.every(validReport))return false;
 if(state.lastReport&&!validReport(state.lastReport))return false;
 return true;
}

t"><span>Quality</span><b>${r.quality}/100</b></div><div class="mini-stat"><span>Novelty</span><b>${r.novelty}/100</b></div><div class="mini-stat"><span>Marketing</span><b>${f(r.marketing)}</b></div></div>`).join('')}</div><div class="panel mt-16">${panelTitle('Why are we losing?','Your decisions on the executive desk change these relative advantages.')}<div class="table-wrap"><table class="data-table"><thead><tr><th>Dimension</th><th>Our company</th><th>Strongest rival</th></tr></thead><tbody><tr><td>Price</td><td>${f(decision.price)}</td><td>${f(Math.min(...state.rivals.map(r=>r.price)))}</td></tr><tr><td>Product quality</td><td>${r.firm.quality}/100</td><td>${Math.max(...state.rivals.map(r=>r.quality))}/100</td></tr><tr><td>Novelty</td><td>${r.firm.novelty}/100</td><td>${Math.max(...state.rivals.map(r=>r.novelty))}/100</td></tr><tr><td>Public trust</td><td>${state.trust}/100</td><td>${Math.max(...state.rivals.map(r=>r.trust))}/100</td></tr><tr><td>Marketing</td><td>${f(decision.marketing)}</td><td>${f(Math.max(...state.rivals.map(r=>r.marketing)))}</td></tr></tbody></table></div></div>`;}
function lineGraph(values){if(values.length<2)return `<div class="empty-state">Complete one quarter to unlock the financial trend chart.</div>`;const W=740,H=246,P=48;const lo=Math.min(0,...values),hi=Math.max(0,...values),range=Math.max(1,hi-lo);const pts=values.map((v,i)=>[P+(W-P*1.7)*i/(values.length-1),H-P-(v-lo)/range*(H-P*1.65)]);const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="Cash balance line chart" role="img">${Array.from({length:5},(_,i)=>{const y=22+i*45;const val=hi-(hi-lo)*i/4;return `<line x1="${P}" y1="${y}" x2="${W-25}" y2="${y}" class="chart-gridline"/><text x="6" y="${y+4}" class="chart-axis">${esc(Math.abs(val)>=100000?(Math.round(val/1000)+'k'):Math.round(val/1000)+'k')}</text>`;}).join('')}<path d="${d}" class="chart-line"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" class="chart-dot"><title>Q${i}: ${f(values[i])}</title></circle>`).join('')}<text x="${P}" y="${H-6}" class="chart-axis">START</text><text x="${W-60}" y="${H-6}" class="chart-axis">LATEST</text></svg>`;}
function finance(){const last=state.lastReport;const rows=[{label:'Revenue',field:'revenue'},{label:'Cost of goods sold',calc:h=>-h.expenses.cogs},{label:'Payroll',calc:h=>-h.expenses.payroll},{label:'Facility overhead',calc:h=>-h.expenses.overhead},{label:'Advertising',calc:h=>-h.expenses.marketing},{label:'Research & development',calc:h=>-h.expenses.research},{label:'People policy',calc:h=>-h.expenses.people},{label:'Product launch',calc:h=>-h.expenses.launchCost},{label:'Incident costs',calc:h=>-h.expenses.incident},{label:'Depreciation',calc:h=>-h.expenses.depreciation},{label:'Operating income',field:'operatingIncome'},{label:'Interest',calc:h=>-h.expenses.interest},{label:'Income tax',calc:h=>-h.expenses.tax},{label:'Net income',field:'netIncome'},{label:'Operating cash flow',field:'operationsCash'}];return `${head('Every dollar leaves a paper trail.','Real arithmetic, fictional corporate accountability. Every quarter records an income statement and a cash-flow bridge.','GAAP-ISH / DISCLOSED')}<div class="stats-grid">${st('Cash',f(state.cash),'Liquid assets')}${st('Equipment',f(state.plant),'Net book value')}${st('Outstanding debt',f(state.debt),'9% annual interest')}${st('Net worth',f(netWorth(state)),'Assets − liabilities')}</div><div class="panel mb-16">${panelTitle('Cash balance over time','Quarterly end-of-period cash. Not cumulative revenue.')} ${lineGraph([180000,...state.history.map(h=>h.cash)])}</div><div class="content-grid"><section class="panel">${panelTitle('Income statement',last?`Quarter ${last.quarter}: ${last.product}`:'No operating results filed yet.')} ${last?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Line item</th><th>Quarter ${last.quarter}</th></tr></thead><tbody>${rows.map((r)=>{const v=r.calc?r.calc(last):last[r.field];return `<tr><td><b>${r.label}</b></td><td class="${v<0?'negative':''}">${f(v)}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty-state">Run the first quarter to produce an income statement.</div>'}<p class="fineprint mt-12">Cash sales and cash operating expenses, declining-balance equipment depreciation at 2.5% of opening net book value per quarter, 22% tax on positive taxable income, no loss carryforwards. No accounts receivable or inventory. Simplified corporate accounting, not GAAP.</p></section><section class="stack"><div class="panel">${panelTitle('Cash-flow bridge','Net income is not the same as cash.')} ${last?`<div class="table-wrap"><table class="data-table"><tbody><tr><td>Net income</td><td>${f(last.netIncome)}</td></tr><tr><td>Add depreciation</td><td>${f(last.expenses.depreciation)}</td></tr><tr><td>Factory capital spending</td><td>−${f(last.expenses.capitalExpenditure)}</td></tr><tr><td>Net debt financing</td><td>${signed(last.expenses.financing)}</td></tr><tr><td><b>Ending cash</b></td><td><b>${f(last.cash)}</b></td></tr></tbody></table></div><p class="hint">Ending cash also includes the quarter's starting balance.</p>`:'<div class="empty-state">No cash-flow statements yet.</div>'}</div><div class="panel">${panelTitle('Capital structure')}<p class="smallcaps muted">Assets</p><div class="mini-stat"><span>Cash</span><b>${f(state.cash)}</b></div><div class="mini-stat"><span>Factory & equipment</span><b>${f(state.plant)}</b></div><p class="smallcaps muted mt-16">Liabilities + equity</p><div class="mini-stat"><span>Debt</span><b>${f(state.debt)}</b></div><div class="mini-stat"><span>Owner's equity</span><b>${f(netWorth(state))}</b></div></div></section></div><div class="panel mt-16">${panelTitle('Quarterly ledger','History of financial decisions. Export the save to preserve your run.')}<div class="table-wrap"><table class="data-table"><thead><tr><th>Period</th><th>Product</th><th>Sales</th><th>Revenue</th><th>Net income</th><th>Cash</th></tr></thead><tbody>${state.history.length?state.history.map(h=>`<tr><td>Q${h.quarter}</td><td>${esc(h.product)}</td><td>${nfmt(h.units)}</td><td>${f(h.revenue)}</td><td class="${h.netIncome<0?'negative':'positive'}">${f(h.netIncome)}</td><td>${f(h.cash)}</td></tr>`).join(''):'<tr><td colspan="6">No quarters completed.</td></tr>'}</tbody></table></div><button class="small-btn mt-16" data-action="exportCsv">↓ EXPORT FINANCIAL CSV</button></div>`;}
function products(){return `${head('Research. Develop. Regret.','Replace your flagship product with a new terrible idea. Launching costs $31,000 and resets the product attributes.','INNOVATION / DEBATABLE')}<div class="panel mb-16">${panelTitle('New product portfolio','The upcoming quarter uses the selected product. Your original product is free to keep.')}<div class="product-select">${PRODUCTS.map(p=>{const active=p.id===state.productId;const sel=decision.launch===p.id;return `<button class="prod-option ${sel?'selected':''}" data-choice="launch" data-value="${p.id}" ${state.status!=='active'?'disabled':''}><span>${p.icon}</span><b>${esc(p.name)} ${active?'(current)':''}</b><small>${esc(p.tag)}</small></button>`;}).join('')}</div><div class="promo mt-16">${decision.launch?`Selected: <b>${esc(productById(decision.launch).name)}</b>. ${decision.launch===state.productId?'Same product; no launch fee.':'Launch spending of $31,000 is recognized as an expense this quarter.'}`:'No launch selected; continue selling your current product.'}</div><button data-action="cancelLaunch" class="small-btn mt-12">CLEAR LAUNCH SELECTION</button></div><div class="panel">${panelTitle('The development specification','New products have different base quality, novelty, practical utility, and manufacturing cost.')}<div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Base quality</th><th>Novelty</th><th>Practicality</th><th>Unit cost</th></tr></thead><tbody>${PRODUCTS.map(p=>`<tr><td>${p.icon} ${esc(p.name)}</td><td>${p.quality}</td><td>${p.novelty}</td><td>${p.practical}</td><td>${f(p.unitCost)}</td></tr>`).join('')}</tbody></table></div><p class="hint">Research builds quality over time, while novelty depreciates. The product with the biggest novelty score may still be unprofitable.</p></div><button class="primary mt-16" data-nav="dashboard">← RETURN TO THE EXECUTIVE DESK</button>`;}
function board(){const finished=state.history.length;const totalRevenue=state.history.reduce((a,h)=>a+h.revenue,0);const profit=state.history.reduce((a,h)=>a+h.netIncome,0);return `${head('The board is concerned.','Shareholder pressure, corporate history, and achievements no reputable firm would put on its résumé.','MINUTES / REDACTED')}<div class="stats-grid">${st('Quarters filed',`${finished}/${MAX_QUARTERS}`,'Three-year campaign')}${st('Lifetime sales',f(totalRevenue),'Cumulative revenue')}${st('Lifetime net income',f(profit),'Across all quarters')}${st('Employee morale',`${state.morale}/100`,'Workplace sentiment',state.morale)}</div><div class="panel mb-16">${panelTitle('Your tenure','The board evaluates cash, public trust and the ability to remain solvent.')}<div class="progress">${Array.from({length:MAX_QUARTERS},(_,i)=>`<div class="progress-block ${i<finished?'done':''}" title="Quarter ${i+1}"></div>`).join('')}</div>${state.status==='active'?`<div class="nudge mt-16">COMPANY STATUS: STILL OPERATING. The board is withholding judgment until Q${state.quarter}.</div>`:`<div class="nudge mt-16"><b>${esc(state.endReason)}</b></div>`}<div class="board-note mt-16">${esc(BOARD_QUOTES[(state.quarter-1)%BOARD_QUOTES.length])}</div></div><div class="panel mb-16">${panelTitle('Corporate achievements','Earned by outcomes, not by clicking a checkbox.')}<div class="achievement-grid">${ACHIEVEMENTS.map(a=>{const have=state.achievements.includes(a.id);return `<div class="achievement ${have?'':'locked'}"><div class="achievement-icon">${have?'★':'?'}</div><div><b>${esc(a.title)}</b><p>${esc(a.description)}</p></div></div>`;}).join('')}</div></div><div class="panel">${panelTitle('Incident & competitor log','Nobody should have put these events in writing.')}<div class="feed">${state.feed.length?state.feed.map(x=>`<div class="feed-item ${esc(x.tone)}"><small>QUARTER ${Number(x.quarter)||0} / CORPORATE UPDATE</small><b>${esc(x.title)}</b><p>${esc(x.text)}</p></div>`).join(''):'<div class="empty-state">Nothing has gone wrong yet. This will not last.</div>'}</div></div><div class="panel mt-16">${panelTitle('Save management','Save locally on this device or move a game between browsers with JSON export/import.')}<div class="inline-gap"><button class="small-btn" data-action="exportSave">↓ DOWNLOAD SAVE</button><button class="small-btn" data-action="importSave">↑ IMPORT SAVE</button><button class="small-btn" data-action="reset">↻ NEW COMPANY</button></div><p class="hint">Browser saves are device-specific. Exported save files are not uploaded anywhere. Restarting erases the local progress after confirmation.</p></div>`;}
function render(){if(!validateState(state)){state=newGame();decision=defaultDecisions();notice='Recovered from an invalid save by starting a new company.';}
 const active=state.status==='active';const title=active?`YEAR ${Math.ceil(state.quarter/4)} · Q${((state.quarter-1)%4)+1} / 12`:'COMPANY AUDIT COMPLETE';
 app.innerHTML=`<a href="#main" class="skip">Skip to game</a><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark" aria-hidden="true">H</div><div><div class="brand-name">Horrible<br>Industries.</div><div class="brand-sub">INCORPORATED, BARELY.</div></div></div><div><div class="side-group-label">YOUR OFFICE</div><nav class="nav" aria-label="Game sections">${tabs.map(t=>`<button class="nav-item ${page===t.id?'active':''}" data-nav="${t.id}" aria-current="${page===t.id?'page':'false'}"><span class="nav-icon" aria-hidden="true">${t.icon}</span>${t.name}</button>`).join('')}</nav></div><div class="side-card"><div class="eyebrow">CORPORATE HEALTH</div><strong>${state.status==='active'?'CONCERNING':state.status==='won'?'SURVIVED':'DELISTED'}</strong><p>${state.status==='active'?`Quarter ${state.quarter} of ${MAX_QUARTERS}. The shareholders demand a plausible explanation.`:state.endReason}</p><div class="meter"><div class="meter-fill ${statusColor(state.trust)}" style="width:${state.trust}%"></div></div><span class="eyebrow">PUBLIC TRUST / ${state.trust}%</span></div><div class="sidebar-foot"><button class="ghost-dark" data-action="exportSave">↓ EXPORT GAME SAVE</button><button class="ghost-dark" data-action="help">? HOW TO PLAY</button><div class="eyebrow muted">A GAME ABOUT BUSINESS MISTAKES<br>VERSION 1.0 / LOCAL FIRST</div></div></aside><main id="main" class="main"><div class="topline"><div class="eyebrow">H / I&nbsp; &nbsp; ${title}</div><div class="top-actions"><div class="pill"><span class="live-dot"></span>${active?(persistenceOk?'AUTOSAVE ON':'EXPORT TO SAVE'):'CAMPAIGN ENDED'}</div><button class="utility" data-action="help">? HELP</button><button class="utility" data-action="exportSave">↓ SAVE</button></div></div>${notice?`<div class="notice" role="status"><span>${esc(notice)}</span><button data-action="dismiss">✕</button></div>`:''}${!persistenceOk?'<div class="notice"><span>Local autosave is unavailable in this browser context. Export a JSON save before closing.</span></div>':''}${state.status!=='active'?`<div class="end-banner"><div class="eyebrow">OFFICIAL SHAREHOLDER COMMUNICATION</div><h2>${state.status==='won'?'You survived the impossible.':'An unfortunate market correction.'}</h2><p>${esc(state.endReason)} Final cash: ${f(state.cash)}. Final net worth: ${f(netWorth(state))}. Total lifetime sales: ${f(state.history.reduce((a,h)=>a+h.revenue,0))}.</p><button class="primary" data-action="reset">↻ FOUND ANOTHER BAD COMPANY</button></div>`:''}${page==='dashboard'?dashboard():page==='market'?market():page==='finance'?finance():page==='products'?products():board()}<footer class="footer"><span>© HORRIBLE INDUSTRIES / FICTIONAL SIMULATION</span><span>NO SERVERS · NO REAL MONEY · ALL BAD IDEAS ORIGINAL</span></footer></main></div><nav class="mobile-nav" aria-label="Mobile game navigation">${tabs.map(t=>`<button class="${page===t.id?'active':''}" data-nav="${t.id}" aria-label="${t.name}"><b>${t.icon}</b>${t.short}</button>`).join('')}</nav><input class="file-input" type="file" id="saveInput" accept=".json,application/json"><dialog id="dialog" class="report-dialog"></dialog>`;
 if(pendingReport)showReport();
}
function showReport(){if(!state.lastReport)return;const r=state.lastReport;const box=document.querySelector('#dialog');box.innerHTML=`<div class="report-head"><div class="eyebrow">QUARTERLY RESULTS / Q${r.quarter}</div><h2>Another quarter. <i>Somehow.</i></h2></div><div class="report-body"><div class="eyebrow muted">NET INCOME</div><div class="report-number ${r.netIncome<0?'negative':'positive'}">${f(r.netIncome)}</div><div class="report-event"><b>${esc(r.event?.title||'An unusually normal quarter')}</b><p>${esc(r.event?.text||'Nothing of note happened.')}</p></div><div class="report-stats"><div class="report-stat"><small>UNITS SOLD</small><b>${nfmt(r.units)}</b></div><div class="report-stat"><small>REVENUE</small><b>${f(r.revenue)}</b></div><div class="report-stat"><small>ENDING CASH</small><b>${f(r.cash)}</b></div><div class="report-stat"><small>NET WORTH</small><b>${f(r.netWorth)}</b></div></div><div class="eyebrow muted">COMPETITORS MOVED</div><ul class="report-news">${(r.rivalNews||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul><div class="report-footer"><button class="primary block" data-action="closeReport">${state.status==='active'?'CONTINUE TO NEXT QUARTER →':'VIEW FINAL RESULTS →'}</button><button class="small-btn" data-nav="finance">VIEW FINANCIAL LEDGER</button></div></div>`;pendingReport=false;box.showModal();}
function showHelp(){const box=document.querySelector('#dialog');box.innerHTML=`<div class="report-head"><div class="eyebrow">EMPLOYEE HANDBOOK / CLASSIFIED</div><h2>How to run an awful company.</h2></div><div class="report-body"><p>You have <b>12 quarters</b> to survive. On the Executive Desk set a retail price, marketing budget, research budget, employee policy, optional factory expansion, and loan decision. Press <b>File quarterly results</b> to run the simulation.</p><div class="nudge mt-16"><b>Objective:</b> Keep cash at or above $0 and avoid public trust or reputation falling below 8. Survive all 12 quarters.</div><div class="mt-16"><b>Mechanics</b><p class="tiny">Customers belong to three segments. A market-choice model distributes purchasing interest among your product, three autonomous competitors, and the option not to purchase. Price, quality, novelty, practicality, reputation, trust, and marketing all affect demand. Manufacturing capacity caps sales.</p></div><div class="mt-16"><b>Financial model</b><p class="tiny">Revenue minus manufacturing, wages, overhead, marketing, R&D, launch spending, incident costs, depreciation, interest and tax produces net income. Cash flow adds back non-cash depreciation and accounts separately for equipment investment and loans. Product launches are expensed; factories are capitalized.</p></div><div class="mt-16"><b>Saving and playing on devices</b><p class="tiny">Your progress auto-saves in this browser. Export JSON to move a game between devices. The packaged game works locally in desktop browsers. For reliable phone use, serve the project on an HTTPS static host and add it to your home screen as a PWA.</p></div><p class="fineprint mt-16">All people, corporations, incidents, and market parameters in this game are fictional. The model is internally consistent but is not a calibrated forecast of real industries.</p><button class="primary block mt-16" data-action="closeReport">UNDERSTOOD. PLEASE DON'T TELL THE BOARD.</button></div>`;box.showModal();}
function setDecision(key,value){if(key==='price')decision.price=Number(value);else if(key==='marketing'||key==='research')decision[key]=Number(value);else if(key==='factory')decision.factory=!!value;else if(key==='finance'||key==='culture')decision[key]=value;else if(key==='launch')decision.launch=value===state.productId?'':value;persistenceOk=saveGame(state);render();}
function exportCsv(){const escCsv=s=>'"'+String(s??'').replaceAll('"','""')+'"';const headers=['quarter','product','units','price','revenue','cogs','payroll','overhead','marketing','research','people','incident','launch_expense','depreciation','interest','tax','net_income','operating_cash','capex','debt_financing','cash','debt','plant','net_worth'];const values=state.history.map(h=>[h.quarter,h.product,h.units,h.price,h.revenue,h.expenses.cogs,h.expenses.payroll,h.expenses.overhead,h.expenses.marketing,h.expenses.research,h.expenses.people,h.expenses.incident,h.expenses.launchCost,h.expenses.depreciation,h.expenses.interest,h.expenses.tax,h.netIncome,h.operationsCash,h.expenses.capitalExpenditure,h.expenses.financing,h.cash,h.debt,h.plant,h.netWorth]);const csv=[headers.join(','),...values.map(row=>row.map(escCsv).join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='horrible-industries-financial-ledger.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
app.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;
 const nextPage=button.dataset.nav;if(nextPage){page=nextPage;notice='';render();window.scrollTo({top:0,behavior:'instant'});return;}
 if(button.dataset.choice){setDecision(button.dataset.choice,button.dataset.value);return;}
 switch(button.dataset.action){
 case 'play':try{if(state.status!=='active')return;state=playQuarter(state,decision);persistenceOk=saveGame(state);decision=defaultDecisions();pendingReport=true;notice='';render();}catch(err){notice=err.message;render();}break;
 case 'closeReport':document.querySelector('#dialog')?.close();render();break;
 case 'openReport':showReport();break;
 case 'help':showHelp();break;
 case 'exportSave':exportGame(state);break;
 case 'exportCsv':exportCsv();break;
 case 'importSave':document.getElementById('saveInput')?.click();break;
 case 'cancelLaunch':setDecision('launch','');break;
 case 'reset':if(window.confirm('Start a new company? Your browser save will be replaced. Export your old run first if you want to keep it.')){clearGame();state=newGame();decision=defaultDecisions();persistenceOk=saveGame(state);page='dashboard';notice='New company incorporated. The investors seem nervous.';render();window.scrollTo(0,0);}break;
 case 'dismiss':notice='';render();break;
 }
});
app.addEventListener('input',e=>{if(e.target.dataset.field==='price'){decision.price=Number(e.target.value);const label=document.querySelector('#price-label');if(label)label.textContent=f(decision.price)+' per unit';// Update the financial forecast on release rather than re-creating a moving slider.
}});
app.addEventListener('change',async e=>{if(e.target.dataset.field==='price')setDecision('price',e.target.value);if(e.target.dataset.field==='factory')setDecision('factory',e.target.checked);if(e.target.id==='saveInput'&&e.target.files?.[0]){try{const imported=await importGame(e.target.files[0]);state=imported;decision=defaultDecisions();persistenceOk=saveGame(state);page='dashboard';notice='Saved game imported successfully.';render();}catch(err){notice=err.message;render();}}});
render();


})();
</script>
